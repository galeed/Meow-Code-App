name: Build Arch Linux Package

on:
push:
branches:
- main
- master
paths:
- 'PKGBUILD'
- '**/*.install'
pull_request:
branches:
- main
- master
workflow_dispatch: # Permite ejecutar la compilación manualmente desde la pestaña "Actions" de GitHub

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Arch Linux PKGBUILD Package
uses: MotorTruck1221/arch-linux-pkgbuild-package@v2.2.1
with:
# Actualiza automáticamente los checksums si el código fuente cambia
updpkgsums: true
# Genera el archivo .SRCINFO necesario para repositorios y validaciones
srcinfo: true
# Analiza el paquete con namcap en busca de errores o malas prácticas
namcap: true
# Flags adicionales para makepkg (-c limpia, -f fuerza, -s sincroniza dependencias, --noconfirm automatiza)
flags: '-cfs --noconfirm'

- name: Upload built package artifact
uses: actions/upload-artifact@v4
with:
name: archlinux-package
path: |
*.pkg.tar.*
.SRCINFO
